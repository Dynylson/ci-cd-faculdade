name: CI — Qualidade

on:
  push:
    branches:
      - main
      - homologacao
  pull_request:
    branches:
      - main
      - homologacao

jobs:
  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🔎 Verificar Linter (ESLint)
        run: npm run lint

      - name: 🧪 Executar testes de unidade e integração
        run: npm test

      - name: 📊 Verificar cobertura de código (mínimo 90%)
        run: npm run test:coverage
