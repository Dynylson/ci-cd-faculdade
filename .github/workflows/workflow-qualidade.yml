name: CI/CD — Baseline & Docker

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

env:
  DOCKER_IMAGE: lucgbrel/ci-cd-faculdade

jobs:
  # ========================================================
  # JOB 1: Qualidade e Testes de Software
  # ========================================================
  qualidade:
    name: 1. Qualidade e Testes
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Instalar dependências
        run: npm ci --ignore-scripts

      - name: 🔎 Verificar Linter (ESLint)
        run: npm run lint

      - name: 🧪 Executar testes de unidade e integração
        run: npm test

      - name: 📊 Verificar cobertura de código (mínimo 90%)
        run: npm run test:coverage

  # ========================================================
  # JOB 2: Construção da Imagem Docker (Qualquer branch)
  # ========================================================
  build-docker:
    name: 2. Construção da Imagem Docker
    runs-on: ubuntu-latest
    needs: [qualidade]

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Compilar imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.DOCKER_IMAGE }}:test

      - name: 🧪 Smoke Test no container da imagem
        run: |
          docker run -d -p 8080:8080 --name test-api ${{ env.DOCKER_IMAGE }}:test
          sleep 3
          curl --fail --retry 3 --retry-delay 2 http://localhost:8080/api/pratos || (docker logs test-api && exit 1)
          docker stop test-api
          docker rm test-api

  # ========================================================
  # JOB 3: Publicação da Imagem no DockerHub (Apenas baseline)
  # ========================================================
  publish-docker:
    name: 3. Publicação no DockerHub
    runs-on: ubuntu-latest
    needs: [build-docker]
    # Executa apenas quando houver push direto ou merge na baseline (main)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 Publicar imagem no Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
