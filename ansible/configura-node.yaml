---
# Instala a API "Delivery de Restaurantes" na VM2 a partir do GitHub.
#
# Execução (dentro da VM1, nó de controle):
#   cd ~/ansible && ansible-playbook configura-node.yaml

- name: Configura a VM2 com a API Delivery de Restaurantes
  hosts: backend
  become: true

  vars:
    repo_url: https://github.com/Dynylson/ci-cd-faculdade.git
    repo_version: main
    node_major: 22
    app_dir: /opt/ci-cd-faculdade
    app_user: delivery
    # A porta 8080 da VM2 já é usada pela instância provisionada pelo Vagrant
    # (a partir de /vagrant_data); esta instância, clonada do GitHub, usa a 3000.
    app_port: 3000
    service_name: delivery-api-ansible
    api_url: "http://{{ hostvars[inventory_hostname]['ansible_host'] | default(inventory_hostname) }}:{{ app_port }}/api/pratos"

  tasks:
    # ------------------------------------------------------------------
    # 1. Dependências de execução: git (para o clone) e Node.js
    # ------------------------------------------------------------------
    - name: Instala pacotes básicos (git, curl, ca-certificates)
      ansible.builtin.apt:
        name: [git, curl, ca-certificates]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Garante o diretório de chaves do apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Baixa a chave GPG do repositório da NodeSource
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: "0644"

    - name: Configura o repositório APT do Node.js {{ node_major }}
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/nodesource.list
        content: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main\n"
        mode: "0644"
      register: nodesource_repo

    - name: Instala o Node.js {{ node_major }}
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: "{{ nodesource_repo.changed }}"

    # ------------------------------------------------------------------
    # 2. Clone do repositório
    # ------------------------------------------------------------------
    - name: Clona o repositório da aplicação ({{ repo_version }})
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_version }}"
      register: repo
      notify: Reinicia a API

    # ------------------------------------------------------------------
    # 3. Dependências npm de produção
    # ------------------------------------------------------------------
    - name: Verifica se as dependências npm já estão instaladas
      ansible.builtin.stat:
        path: "{{ app_dir }}/node_modules"
      register: node_modules

    - name: Instala as dependências de execução (npm ci --omit=dev)
      ansible.builtin.command:
        cmd: npm ci --omit=dev --ignore-scripts --no-audit --no-fund --no-update-notifier
        chdir: "{{ app_dir }}"
      # Só roda quando o código mudou ou não há node_modules; se roda, altera.
      when: repo.changed or not node_modules.stat.exists
      changed_when: true
      notify: Reinicia a API

    # ------------------------------------------------------------------
    # 4. Execução da aplicação como serviço systemd
    # ------------------------------------------------------------------
    - name: Cria o usuário de sistema da aplicação
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Cria o serviço {{ service_name }}
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ service_name }}.service"
        mode: "0644"
        content: |
          [Unit]
          Description=API Delivery de Restaurantes (instalada pelo Ansible)
          After=network-online.target
          Wants=network-online.target

          [Service]
          User={{ app_user }}
          WorkingDirectory={{ app_dir }}
          Environment=NODE_ENV=production
          Environment=PORT={{ app_port }}
          ExecStart=/usr/bin/node src/server.js
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
      notify: Reinicia a API

    - name: Habilita e inicia o serviço {{ service_name }}
      ansible.builtin.systemd_service:
        name: "{{ service_name }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Aplica os reinícios pendentes antes da verificação
      ansible.builtin.meta: flush_handlers

    # ------------------------------------------------------------------
    # 5. Verificação a partir do nó de controle (VM1)
    # ------------------------------------------------------------------
    - name: Testa GET /api/pratos a partir da VM1
      ansible.builtin.uri:
        url: "{{ api_url }}"
        return_content: true
      delegate_to: localhost
      become: false
      register: api
      retries: 15
      delay: 2
      until: api.status == 200

    - name: Mostra o resultado
      ansible.builtin.debug:
        msg: "API no ar em {{ api_url }} ({{ api.json | length }} pratos cadastrados)"

  handlers:
    - name: Reinicia a API
      ansible.builtin.systemd_service:
        name: "{{ service_name }}"
        state: restarted
        daemon_reload: true
