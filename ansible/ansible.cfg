# Configuração do Ansible usada no nó de controle (VM1).
# Esta pasta é montada em /home/vagrant/ansible na VM1 pelo Vagrantfile;
# rode os comandos a partir dela para que este arquivo seja carregado.

[defaults]
inventory = hosts.ini
remote_user = vagrant
# Chave SSH gerada pelo Vagrantfile: a privada fica na VM1 e a pública é
# autorizada na VM2.
private_key_file = ~/.ssh/id_rsa
# As VMs são locais e descartáveis (a chave de host muda a cada recriação).
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
pipelining = True
